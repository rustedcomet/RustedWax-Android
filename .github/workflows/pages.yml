name: Deploy documentation site

on:
  push:
    branches:
      - main
    paths:
      - "Documentation/index.html"
      - "Documentation/.nojekyll"
      - "Documentation/Assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the public site allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/Assets
          cp Documentation/index.html Documentation/.nojekyll _site/
          cp -R Documentation/Assets/. _site/Assets/

      # upload-pages-artifact excludes dotfiles while creating its tarball.
      # Build the same Pages artifact explicitly so .nojekyll is retained.
      - name: Archive public site artifact
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory _site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload public site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
