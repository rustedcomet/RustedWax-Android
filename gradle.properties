org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Instrumented runs must not uninstall the app.
#
# AGP's default teardown for `connectedAndroidTest` is `pm uninstall`, which
# takes package data, encrypted credentials, deduplication state, retry state,
# and the notification-listener grant with it.
#
# Connected tests may target a non-disposable installation, so APKs remain
# installed after a run. Use a disposable profile when teardown isolation is
# required.
android.injected.androidTest.leaveApksInstalledAfterRun=true
