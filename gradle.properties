org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Instrumented runs must not uninstall the app.
#
# AGP's default teardown for `connectedAndroidTest` is `pm uninstall`, which
# takes the package's data with it. On 2026-08-13 that erased this project's
# field device: the posting key in `EncryptedSharedPreferences`, the dedup
# ledger, the retry queue and the notification-listener grant, all of which the
# Phase 2/3 report explicitly required preserving.
#
# The app under test here is a real installation on a real phone, not a
# disposable emulator image, so the APKs stay put after a run.
android.injected.androidTest.leaveApksInstalledAfterRun=true
